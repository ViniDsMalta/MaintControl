<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaintControl</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="MaintControl" class="logo">

        <nav class="menu" id="menu">
            <a href="#dashboard">Dashboard</a>
            <a href="#maquinas">Máquinas</a>
            <a href="#contato">Contato</a>
        </nav>

        <div class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <section class="dashboard">
        <div class="cards">
            <div class="card">
                <h3>Dashboard</h3>
            </div>
        </div>
        <div class="cardss">
            <div class="cardd status-operando">
                <h1>4</h1>
                <h3>Operando</h3>
            </div>
            <div class="cardd status-atencao">
                <h1>1</h1>
                <h3>Atenção</h3>
            </div>
            <div class="cardd status-critico">
                <h1>1</h1>
                <h3>Crítico</h3>
            </div>
            <div class="cardd status-desativada">
                <h1>0</h1>
                <h3>Desativada</h3>
            </div>
        </div>
        <div class="card total" id="quant_maq_totais">
            <h3>Máquinas Totais: 4</h3>
        </div>
    </section>
    <section class="maquinas misturador">
        <div class="cardd misturador"></div>
        <div class="cardd misturador info"></div>
    </section>
</body>
</html>
