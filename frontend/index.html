<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaintControl</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
</head>
<body>
    <header class="header">
        <img src="logo.png" alt="MaintControl" class="logo">

        <nav class="menu" id="menu">
            <a href="#dashboard">Dashboard</a>
            <a href="#maquinas">Máquinas</a>
            <a href="#contato">Contato</a>
        </nav>

        <div class="menu-toggle" id="menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <section class="dashboard">
        <div class="cards">
            <div class="card bordacards">
                <h3>Dashboard</h3>
            </div>
        </div>
        <div class="cardss">
            <div class="cardd status-operando">
                <h1>4</h1>
                <h3>Operando</h3>
            </div>
            <div class="cardd status-atencao">
                <h1>1</h1>
                <h3>Atenção</h3>
            </div>
            <div class="cardd status-critico">
                <h1>1</h1>
                <h3>Crítico</h3>
            </div>
            <div class="cardd status-desativada">
                <h1>0</h1>
                <h3>Desativada</h3>
            </div>
        </div>
        <div class="card total bordacards" id="quant_maq_totais">
            <h3>Máquinas Totais: 4</h3>
        </div>
    </section>
    <section class="maquinas misturador">
        <div class="cardd misturador">
            <h1>SINMAG SM50 - Misturador</h1>
            <h2>🟢 Operando</h2>
            <img src="./misturador.png" alt="Misturador">
        </div>
        <div class="cardd info misturador">
            <div class="info-cards">
                <div class="info caards temperatura bordacards misturador">
                    <h1>Temperatura</h1>
                    <h2>🌡️</h2>
                    <h3 id="valor-temperatura"></h3>
                </div>
                <div class="info caards corrente_eletrica bordacards misturador "></div>
                <div class="info caards tensao bordacards misturador "></div>
                <div class="info caards rotacao bordacards misturador "></div>
            </div>
        </div>
    </section>
</body>
</html>
